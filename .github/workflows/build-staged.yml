name: build-guacamole-kernel
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: []

jobs:
  build:
    timeout-minutes: 400
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Checkout this repo (workflow + build.config + fix_kconfig.sh)
        uses: actions/checkout@v4

      - name: Install cross toolchain + build deps
        run: |
          apt-get update
          apt-get install -y git make gcc gcc-aarch64-linux-gnu bison flex libssl-dev bc python ccache procps file curl

      - name: ccache cache (persist objects across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Clone OnePlus sm8150 source @ Q-branch HEAD (4.14.117)
        run: |
          git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git /kernelsrc
          cd /kernelsrc && git checkout 92ce282d017e

      - name: Neutralize sanitized (missing) Kconfig source lines
        run: bash "$GITHUB_WORKSPACE/fix_kconfig.sh" /kernelsrc

      - name: Configure (device.config base + FORCE=n)
        run: |
          cp "$GITHUB_WORKSPACE/build.config" /kernelsrc/.config
          cd /kernelsrc
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: STAGE 1 - prepare (scripts, host tools, generated headers)
        run: |
          cd /kernelsrc
          export CC="ccache aarch64-linux-gnu-gcc"
          make ARCH=arm64 CROSS_COMPILE='ccache aarch64-linux-gnu-' -j"$(nproc)" prepare
          echo STAGE1_OK

      - name: STAGE 2 - arch/arm64 + init + kernel + mm
        run: |
          cd /kernelsrc
          export CC="ccache aarch64-linux-gnu-gcc"
          make ARCH=arm64 CROSS_COMPILE='ccache aarch64-linux-gnu-' -j"$(nproc)" arch/arm64/kernel/ head.o init/ vmlinux 2>&1 | tail -20
          echo STAGE2_CONCAT_OK

      - name: STAGE 3 - full Image (remaining drivers + link)
        run: |
          cd /kernelsrc
          export CC="ccache aarch64-linux-gnu-gcc"
          make ARCH=arm64 CROSS_COMPILE='ccache aarch64-linux-gnu-' -j"$(nproc)" Image 2>&1 | tail -30
          rc=$?
          echo "STAGE3_RC=$rc"
          ls -la arch/arm64/boot/Image
          exit $rc

      - name: Show vermagic (for module vermagic-matching later)
        run: |
          cd /kernelsrc
          strings arch/arm64/boot/Image | grep -ao '4\.14[a-zA-Z0-9._+-]* [A-Za-z0-9 ]*' | head -1 || true
          cat include/generated/utsrelease.h || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: /kernelsrc/arch/arm64/boot/Image

      - name: Upload last-20 build lines (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-tail
          path: /kernelsrc/stage-tail.log
        continue-on-error: true