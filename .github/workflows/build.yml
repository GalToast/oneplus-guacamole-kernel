name: build-guacamole-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Checkout this repo (workflow + build.config + fix_kconfig.sh)
        uses: actions/checkout@v4

      - name: Install cross toolchain + build deps
        run: |
          apt-get update
          apt-get install -y git make gcc gcc-aarch64-linux-gnu bison flex libssl-dev bc python ccache

      - name: ccache cache (persist objects across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Clone OnePlus sm8150 source @ Q-branch HEAD (4.14.117)        run: |
          git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git kernel

          cd kernel && git checkout 92ce282d017e

      - name: Neutralize sanitized (missing) Kconfig source lines
        run: bash ./fix_kconfig.sh

      - name: Configure (device.config base + FORCE=n)
        run: |
          cd kernel
          cp ../build.config .config
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel Image
        run: |
          echo "NPROC=$(nproc)"
          cd kernel
          export CC="ccache aarch64-linux-gnu-gcc"
          ccache -M 4G
          make ARCH=arm64 CROSS_COMPILE='ccache aarch64-linux-gnu-' -j"$(nproc)" Image 2>&1 | tail -75
          rc=${PIPESTATUS[0]}
          echo "BUILD_RC=$rc"
          exit $rc
          test -f arch/arm64/boot/Image && echo IMAGE_OK
      - name: Show vermagic (for module vermagic-matching later)
        run: |
          cd kernel
          strings arch/arm64/boot/Image | grep -ao '4\.14[a-zA-Z0-9._+-]* [A-Za-z0-9 ]*' | head -1 || true
          echo "--- utsrelease ---"
          cat include/generated/utsrelease.h || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image
  probe:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 20
    steps:
      - name: Checkout this repo (workflow + build.config)
        uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y git make gcc gcc-aarch64-linux-gnu bison flex libssl-dev bc python ccache
      - name: Clone (shallow) + config
        run: |
          git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git kernel
          cd kernel && git checkout 92ce282d017e
          bash ../fix_kconfig.sh
          cp ../build.config .config
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      - name: Toolchain probe (compile ONE object)
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 init/main.o
          echo "PROBE_RESULT $?"
          ls -la init/main.o || true
          echo "PROBE_DONE"
