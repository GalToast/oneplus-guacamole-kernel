name: build-guacamole-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    timeout-minutes: 400
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Checkout this repo (workflow + build.config + fix_kconfig.sh)
        uses: actions/checkout@v4

      - name: Install cross toolchain + build deps
        run: |
          apt-get update
          apt-get install -y git make gcc gcc-aarch64-linux-gnu bison flex libssl-dev bc python ccache procps file

      - name: ccache cache (persist objects across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Clone OnePlus sm8150 source @ Q-branch HEAD (4.14.117)
        run: |
          git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git kernel
          cd kernel && git checkout 92ce282d017e

      - name: Neutralize sanitized (missing) Kconfig source lines
        run: bash ./fix_kconfig.sh

      - name: Configure (device.config base + FORCE=n)
        run: |
          cd kernel
          cp ../build.config .config
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel Image (streaming + live progress beacon)
        run: |
          cd kernel
          export CC="ccache aarch64-linux-gnu-gcc"
          export HOME=/tmp
          git config user.email ci@example.com
          git config user.name ci
          # make with -pipe, no tail: stdout streams; every 120s push object probes to a progress branch
          (while true; do
             echo "===BEACON $(date -u +%H:%M:%S)===";
             find arch -name '*.o' -printf '%h/%f\n' 2>/dev/null | tail -3;
             find arch -name '*.o' 2>/dev/null | wc -l;
             python3 -c "import os;[print(os.path.getmtime(f)) for f in ['arch/arm64/boot/Image'] if os.path.exists(f)]" 2>/dev/null;
             printf '%s beacon ok %d objs\n' "$(date -u +%H:%M:%S)" "$(find . -name '*.o' 2>/dev/null | wc -l)" >> /tmp/beacon.log;
             git add -A 2>/dev/null; git commit -q -m "beacon $(date -u +%H:%M:%S)" 2>/dev/null;
             git push -q origin HEAD:progress --force 2>/dev/null || true;
             sleep 180;
           done) &
          make ARCH=arm64 CROSS_COMPILE='ccache aarch64-linux-gnu-' -j"$(nproc)" Image 2>&1
          rc=$?
          echo "BUILD_RC=$rc"
          ls -la arch/arm64/boot/Image
          exit $rc

      - name: Show vermagic (for module vermagic-matching later)
        run: |
          cd kernel
          strings arch/arm64/boot/Image | grep -ao '4\.14[a-zA-Z0-9._+-]* [A-Za-z0-9 ]*' | head -1 || true
          cat include/generated/utsrelease.h || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image