name: build-guacamole-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    timeout-minutes: 400
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Checkout this repo (workflow + build.config + fix_kconfig.sh)
        uses: actions/checkout@v4

      - name: Install cross toolchain + build deps
        run: |
          apt-get update
          apt-get install -y git make gcc gcc-aarch64-linux-gnu bison flex libssl-dev bc python ccache procps file curl

      - name: ccache cache (persist objects across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Clone OnePlus sm8150 source @ Q-branch HEAD (4.14.117)
        run: |
          git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git /kernelsrc
          cd /kernelsrc && git checkout 92ce282d017e

      - name: Neutralize sanitized (missing) Kconfig source lines
        run: bash "$GITHUB_WORKSPACE/fix_kconfig.sh" /kernelsrc

      - name: Configure (device.config base + FORCE=n)
        run: |
          cp "$GITHUB_WORKSPACE/build.config" /kernelsrc/.config
          cd /kernelsrc
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel Image (streaming + live progress beacon)
        run: |
          export HOME=/tmp
          git config --global user.email ci@example.com
          git config --global user.name ci

          # Beacon: append compile probes to a file in the WORKSPACE repo and push
          # the 'progress' branch there. Workspace origin already carries checkout creds.
          WS="$GITHUB_WORKSPACE"
          echo "# beacon $(date -u +%H:%M:%S) run=$GITHUB_RUN_ID" >> "$WS/beacon.log"

          (while true; do
            { echo "t=$(date -u +%H:%M:%S)";
              echo "objs=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)";
              echo "arch_objs=$(find /kernelsrc/arch -name '*.o' 2>/dev/null | wc -l)";
              ls /kernelsrc/arch/arm64/boot/ 2>/dev/null | grep Image || echo image-not-yet; } >> "$WS/beacon.log"
            git -C "$WS" add beacon.log 2>/dev/null
            git -C "$WS" commit -q -m "beacon $(date -u +%H:%M:%S)" 2>/dev/null
            git -C "$WS" push -q origin HEAD:progress 2>/dev/null
            sleep 180
          done) &

          cd /kernelsrc
          make ARCH=arm64 CROSS_COMPILE='ccache aarch64-linux-gnu-' -j"$(nproc)" Image 2>&1
          rc=$?
          echo "BUILD_RC=$rc"
          ls -la /kernelsrc/arch/arm64/boot/Image
          exit $rc
      - name: Show vermagic (for module vermagic-matching later)
        run: |
          cd /kernelsrc
          strings arch/arm64/boot/Image | grep -ao '4\.14[a-zA-Z0-9._+-]* [A-Za-z0-9 ]*' | head -1 || true
          cat include/generated/utsrelease.h || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: /kernelsrc/arch/arm64/boot/Image