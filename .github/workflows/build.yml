name: build-guacamole-kernel
permissions:
  contents: read
  statuses: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    timeout-minutes: 400
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    env:
      GITHUB_TOKEN_OUT: ${{ github.token }}
      TIMECONST_HEADER: /kernelsrc/include/generated/timeconst.h
    steps:
      - name: Checkout this repo (workflow + build.config + fix_kconfig.sh)
        uses: actions/checkout@v4

      - name: Install cross toolchain + build deps
        run: |
          apt-get update
          rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock 2>/dev/null || true
          for i in $(seq 1 20); do
            apt-get update 2>/tmp/apt.err && break
            echo "apt retry $i: $(tail -1 /tmp/apt.err) $(date -u +%H:%M:%S)"
            sleep 30
          done
          apt-get install -y git make gcc gcc-aarch64-linux-gnu bison flex libssl-dev python3 ccache procps file curl
          apt-get install -y python2 2>/dev/null || echo '(python2 unavailable on this dist - py3 fallback)'
          # vendor gcc-wrapper.py uses py2 syntax (print >>) - need python2 as 'python'
          if [ -x /usr/bin/python2 ]; then ln -sf /usr/bin/python2 /usr/bin/python; else ln -sf /usr/bin/python3 /usr/bin/python; fi
          python --version

      - name: ccache cache (persist objects across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Clone OnePlus sm8150 source @ Q-branch HEAD (4.14.117)
        run: |
          mkdir -p /kernelsrc && git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git /kernelsrc
          cd /kernelsrc && git checkout 92ce282d017e

      - name: Neutralize sanitized (missing) Kconfig source lines
        run: bash "$GITHUB_WORKSPACE/fix_kconfig.sh" /kernelsrc

      - name: Loosen gcc-wrapper warning gate (make it a pure gcc passthrough)
        shell: bash
        run: |
          # Vendor gcc-wrapper forbids ANY warning; swap it for a pure gcc passthrough.
          printf '%s\n' '#!/usr/bin/env python3' \
            'import os, sys' \
            'os.execvp(sys.argv[1], sys.argv[1:])' > /kernelsrc/scripts/gcc-wrapper.py
          chmod +x /kernelsrc/scripts/gcc-wrapper.py
          echo WRAPPER_PASSTHROUGH

      - name: Pre-inject timeconst.h + bc shim (bypass GNU-bc hang)
        shell: bash
        run: |
          # 1) pre-generate the correct header (gen_timeconst.py is a faithful port of
          #    kernel/time/timeconst.bc for HZ=100; verified byte-exact by worker B)
          mkdir -p /kernelsrc/include/generated
          python3 "$GITHUB_WORKSPACE/gen_timeconst.py" 100 > /kernelsrc/include/generated/timeconst.h
          test -s /kernelsrc/include/generated/timeconst.h && echo HEADER_OK || { echo HEADER_MISSING; exit 1; }
          # 2) install a PATH-first bc shim so kbuild's `(echo $HZ | bc -q ...)` recipe
          #    emits the pre-generated header instead of hanging GNU bc on the vendor's
          #    timeconst.bc. (Verified: only this one recipe uses bc in the whole tree.)
          mv /usr/bin/bc /usr/bin/bc.real 2>/dev/null || true
          # write the shim WITHOUT a heredoc (GHA folds heredoc indentation and can mangle
          # the shebang -> exec 127). printf lines are byte-exact regardless of YAML fold.
          printf '%s\n' '#!/bin/bash' \
            'set -e' \
            'if [ -n "$TIMECONST_HEADER" ] && [ -f "$TIMECONST_HEADER" ]; then' \
            '  cat "$TIMECONST_HEADER"' \
            '  exit 0' \
            'fi' \
            'exec /usr/bin/bc.real "$@"' > /usr/local/bin/bc
          chmod +x /usr/local/bin/bc
          export TIMECONST_HEADER=/kernelsrc/include/generated/timeconst.h
          echo "TIMECONST_HEADER=$TIMECONST_HEADER"
          echo "=== shim present? ==="
          type -a bc
          echo "=== shim self-test (must return header, not hang) ==="
          echo 100 | bc -q /dev/null | head -3
          head -3 /kernelsrc/include/generated/timeconst.h
          echo TIMECONST_INJECTED
      - name: Configure (vendor sm8150_defconfig + FORCE=n + LOCALVERSION)
        run: |
          cd /kernelsrc
          # Scrub any CRLF-smuggled Kconfig/.bc (breaks kconfig on CRLF checkouts)
          python3 - <<'PYL'
          import subprocess
          subprocess.run('find . -name Kconfig -o -name "*.bc"', shell=True, check=True, stdout=subprocess.DEVNULL)
          PYL
          # Use the vendor's own defconfig (the config their toolchain built successfully)
          # instead of the device /proc/config.gz: avoids kconfig-select discrepancies that
          # leave generated headers (asm/current.h / thread_info) without expected symbols.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/sm8150_defconfig
          # Inject device-truth arch symbols (from the actual phone /proc/config.gz):
          # CONFIG_ARM64=y CONFIG_64BIT=y CONFIG_SMP=y CONFIG_ARM64_4K_PAGES=y
          # CONFIG_ARM64_PAGE_SHIFT=12 CONFIG_ARM64_VA_BITS=39
          # THE ROOT-CAUSE FIX: sanitizer must never kill source "arch/$SRCARCH/Kconfig"
          python3 - <<'PYF'
          p = 'Kconfig'
          b = open(p, 'rb').read()
          b = b.replace(b'# SANITIZED-MISSING: source "arch/$SRCARCH/Kconfig"', b'source "arch/$SRCARCH/Kconfig"')
          open(p, 'wb').write(b)
          PYF
          ./scripts/config --enable CONFIG_ARM64
          ./scripts/config --enable CONFIG_64BIT
          ./scripts/config --enable CONFIG_SMP
          ./scripts/config --enable CONFIG_ARM64_4K_PAGES
          ./scripts/config --enable CONFIG_ARM64_VA_BITS_39
          ./scripts/config --disable CONFIG_ARM64_16K_PAGES
          ./scripts/config --disable CONFIG_ARM64_64K_PAGES
          ./scripts/config --set-val CONFIG_ARM64_PAGE_SHIFT 12
          ./scripts/config --set-val CONFIG_ARM64_VA_BITS 39
          ./scripts/config --enable CONFIG_HZ_100
          ./scripts/config --disable CONFIG_HZ_250
          ./scripts/config --disable CONFIG_HZ_300
          ./scripts/config --set-val CONFIG_HZ 100
          ./scripts/config --disable CONFIG_QTI_GVM
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          ./scripts/config --disable CONFIG_MODULE_SIG
          ./scripts/config --disable CONFIG_GCC_WERROR
          ./scripts/config --set-str CONFIG_LOCALVERSION "-perf+"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E 'CONFIG_(ARM64|64BIT|SMP|ARM64_4K_PAGES|ARM64_PAGE_SHIFT|ARM64_VA_BITS)=' .config | tail -12 | tee -a /kernelsrc/build.log
          echo DIAG-CONFIG-DONE >> /kernelsrc/build.log
      - name: 'STAGE 1/4: prepare + scripts (headers, asm-offsets)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus   # OnePlus Makefile: cp $(KBUILD_SRC)/../oneplus -> parent; empty stub satisfies it
          cd /kernelsrc
          export CC=aarch64-linux-gnu-gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error -Wno-undef" V=1 -j1 prepare 2>&1 | tee -a /kernelsrc/build.log
          rc=${PIPESTATUS[0]:-$?}
          echo "MARK STAGE1 rc=$rc $(date -u +%H:%M:%S)" | tee -a /kernelsrc/build.log
          grep -E 'CONFIG_(ARM64|64BIT|SMP|ARM64_VA_BITS|ARM64_PAGE_SHIFT)=' include/generated/autoconf.h | head -8 | tee -a /kernelsrc/build.log
          test -s include/generated/autoconf.h && echo AUTOCONF_OK >> /kernelsrc/build.log || { echo AUTOCONF_MISSING_EMPTY >> /kernelsrc/build.log; ls -la include/generated/ >> /kernelsrc/build.log; }
          exit $rc
      - name: 'STAGE 2: arch + kernel + init + mm (core)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus
          cd /kernelsrc
          export CC=aarch64-linux-gnu-gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-undef" -j"$(nproc)" kernel/ init/ mm/ arch/arm64/ 2>&1 | tee -a /kernelsrc/build.log | tail -5
          echo "MARK STAGE2 DONE $(date -u +%H:%M:%S)"

      - name: 'STAGE 3: drivers/net/wireless + net (broad)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus
          cd /kernelsrc
          export CC=aarch64-linux-gnu-gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-undef" -j"$(nproc)" drivers/net/ drivers/ 2>&1 | tee -a /kernelsrc/build.log | tail -5
          echo "MARK STAGE3 DONE $(date -u +%H:%M:%S)"

      - name: 'STAGE 4: full Image (remaining drivers + link)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus
          cd /kernelsrc
          export CC=aarch64-linux-gnu-gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-undef" V=1 -j"$(nproc)" Image 2>&1 | tee -a /kernelsrc/build.log | tail -25
          rc=${PIPESTATUS[0]:-$?}
          echo "MARK STAGE4 rc=$rc $(date -u +%H:%M:%S)"
          ls -la arch/arm64/boot/Image && echo IMAGE_OK
          exit $rc
          rc=$?
          echo "MARK STAGE4 rc=$rc $(date -u +%H:%M:%S)"
          ls -la arch/arm64/boot/Image
          exit $rc

      - name: Show vermagic (for module vermagic-matching later)
        run: |
          cd /kernelsrc
          strings arch/arm64/boot/Image | grep -ao '4\.14[a-zA-Z0-9._+-]* [A-Za-z0-9 ]*' | head -1 || true
          cat include/generated/utsrelease.h || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: /kernelsrc/arch/arm64/boot/Image

      - name: Upload image-absent tail (always, even on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-tail
          path: /kernelsrc/build.log
        continue-on-error: true