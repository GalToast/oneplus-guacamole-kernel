name: build-guacamole-kernel
permissions:
  contents: read
  statuses: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    timeout-minutes: 400
    runs-on: ubuntu-22.04-arm
    env:
      GITHUB_TOKEN_OUT: ${{ github.token }}
    steps:
      - name: Checkout this repo (workflow + build.config + fix_kconfig.sh)
        uses: actions/checkout@v4

      - name: Install cross toolchain + build deps
        run: |
          apt-get update
          apt-get update
          apt-get install -y git make gcc bison flex libssl-dev bc python3 ccache procps file curl

      - name: ccache cache (persist objects across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Clone OnePlus sm8150 source @ Q-branch HEAD (4.14.117)
        run: |
          git clone --depth 1 --branch oneplus/SM8150_Q_10.0 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git /kernelsrc
          cd /kernelsrc && git checkout 92ce282d017e

      - name: Neutralize sanitized (missing) Kconfig source lines
        run: bash "$GITHUB_WORKSPACE/fix_kconfig.sh" /kernelsrc

      - name: Configure (device.config base + FORCE=n)
        run: |
          cp "$GITHUB_WORKSPACE/build.config" /kernelsrc/.config
          cd /kernelsrc
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE= olddefconfig

      - name: Smoke bounds compile
        run: |
          cd /kernelsrc
          make ARCH=arm64 CROSS_COMPILE= -j1 kernel/bounds.s
          rc=$?
          echo "SMOKE_BOUNDS_RC=$rc"
          ls -la kernel/bounds.s 2>/dev/null || echo "NO bounds.s"
          exit $rc

      - name: 'STAGE 1/4: prepare + scripts (headers, asm-offsets)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus   # OnePlus Makefile: cp $(KBUILD_SRC)/../oneplus -> parent; empty stub satisfies it
          cd /kernelsrc
          export CC=gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE= -j"$(nproc)" prepare scripts
          echo "MARK STAGE1 DONE $(date -u +%H:%M:%S)"

      - name: 'STAGE 2: arch + kernel + init + mm (core)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus
          cd /kernelsrc
          export CC=gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE= -j"$(nproc)" kernel/ init/ mm/ arch/arm64/ 2>&1 | tee -a /kernelsrc/build.log | tail -5
          echo "MARK STAGE2 DONE $(date -u +%H:%M:%S)"

      - name: 'STAGE 3: drivers/net/wireless + net (broad)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus
          cd /kernelsrc
          export CC=gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE= -j"$(nproc)" drivers/net/ drivers/ 2>&1 | tee -a /kernelsrc/build.log | tail -5
          echo "MARK STAGE3 DONE $(date -u +%H:%M:%S)"

      - name: 'STAGE 4: full Image (remaining drivers + link)'
        timeout-minutes: 30
        run: |
          mkdir -p /oneplus
          cd /kernelsrc
          export CC=gcc

          (while true; do
            O=$(find /kernelsrc -name '*.o' 2>/dev/null | wc -l)
            printf '{"state":"pending","context":"kernel-build-progress","description":"objs=%s"}' "$O" | curl -s -X POST -d @- -H "Authorization: Bearer $GITHUB_TOKEN_OUT" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/GalToast/oneplus-guacamole-kernel/statuses/$GITHUB_SHA" >/dev/null 2>&1
            sleep 45
          done) &

          make ARCH=arm64 CROSS_COMPILE= -j"$(nproc)" Image 2>&1 | tee -a /kernelsrc/build.log | tail -8
          rc=$?
          echo "MARK STAGE4 rc=$rc $(date -u +%H:%M:%S)"
          ls -la arch/arm64/boot/Image
          exit $rc

      - name: Show vermagic (for module vermagic-matching later)
        run: |
          cd /kernelsrc
          strings arch/arm64/boot/Image | grep -ao '4\.14[a-zA-Z0-9._+-]* [A-Za-z0-9 ]*' | head -1 || true
          cat include/generated/utsrelease.h || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: /kernelsrc/arch/arm64/boot/Image

      - name: Upload image-absent tail (always, even on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-tail
          path: /kernelsrc/build.log
        continue-on-error: true